    return '<span class="topkey-chip" title="'+(th?'ภาษาไทย':'English')+'"><span class="topkey-rank">#'+realIdx+'</span><span>'+esc(k)+'</span><span style="font-size:9px;color:'+(th?'#10b981':'#0ea5e9')+';font-weight:700">'+(th?'TH':'EN')+'</span></span>';
  }).join('')||'<span class="text-xs text-slate-500">ไม่มีคีย์ตรงตัวกรอง</span>';
  document.getElementById('ltKeys').innerHTML=LT_KEYS.map((k,i)=>'<span class="ltkey-chip"><span class="ltkey-rank">#'+(i+1)+'</span><span>'+esc(k)+'</span></span>').join('');
}
function card(site,idx){
  const color=COLORS[idx%12];
  const q=state.q.toLowerCase();
  const hay=(site.site+' '+site.niche+' '+site.cat+' '+site.title+' '+site.meta+' '+site.primary.map(p=>p.kw).join(' ')+' '+site.secondary.join(' ')).toLowerCase();
  if(q && !hay.includes(q)) return '';
  function filtLang(arr){
    if(state.lang==='all') return arr;
    return arr.filter(k=>state.lang==='th'?isTh(k):!isTh(k));
  }
  const pri=site.primary.filter(p=>state.lang==='all'||p.lang===state.lang);
  const sec=filtLang(site.secondary);
  const priChips=pri.map(p=>chip(p.kw,p.lang,{real:p.real,pri:true})).join('');
  const secChips=sec.map(k=>chip(k,isTh(k)?'th':'en')).join('');
  const tl=site.title.length, ml=site.meta.length;
  return `<div class="card fadein p-5 flex flex-col gap-3.5" style="border-top:3px solid ${color}">
    <div class="flex items-start justify-between gap-2 flex-wrap">
      <div>

          <span style="width:10px;height:10px;border-radius:3px;background:${color};display:inline-block;box-shadow:0 0 10px ${color}"></span>
          <h3 class="text-lg font-extrabold tracking-wide" style="color:${color}">${site.site}</h3>
        </div>
        <div class="text-xs text-slate-400 mt-1">${site.niche}</div>
        <div class="text-[11px] text-slate-500 mt-0.5">หมวดหลัก: <b class="text-slate-300">${esc(site.cat)}</b> <span class="font-mono">${esc(site.path)}</span></div>
      </div>
      <div class="text-right text-[11px] text-slate-400">
        <div>Primary <b class="text-slate-200">${pri.length}/3</b></div>
        <div><span class="lang-th">ไทย</span> / <span class="lang-en">EN</span> สมดุล</div>
      </div>
    </div>
    <div>
      <div class="text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-1.5">คีย์หลักกว้าง · Primary Head Keys (ครอบคลุมทุกการค้นหา)</div>
      <div class="flex flex-wrap gap-1.5">${priChips||'<span class="text-xs text-slate-500">ไม่มีคีย์ตรงตัวกรองภาษา</span>'}</div>
    </div>
    <div>
      <div class="text-[10px] uppercase tracking-widest text-slate-400 font-bold mb-1.5">คีย์รองที่ใช้ได้จริง · Secondary (สอดคล้อง Primary)</div>
      <div class="flex flex-wrap gap-1.5">${secChips||'<span class="text-xs text-slate-500">ไม่มีคีย์ตรงตัวกรองภาษา</span>'}</div>
    </div>
    <div class="rounded-xl p-3" style="background:#0f172a;border:1px solid #1e293b">
      <div class="flex items-center justify-between mb-1">
        <span class="text-[10px] uppercase tracking-widest text-amber-400 font-bold">SEO Title <span class="normal-case font-normal text-slate-500">(≤70 ตัวอักษร · ขึ้นต้นด้วย Primary)</span></span>
        <span class="flex items-center gap-2"><span class="text-[10px] ${tl<=70?'text-emerald-400':'text-red-400'} font-bold">${tl}/70</span><button class="copybtn" data-copy="${esc(site.title)}">copy</button></span>
      </div>
      <div class="text-sm font-semibold text-slate-100 leading-relaxed">${esc(site.title)}</div>
    </div>
    <div class="rounded-xl p-3" style="background:#0f172a;border:1px solid #1e293b">
      <div class="flex items-center justify-between mb-1">
        <span class="text-[10px] uppercase tracking-widest text-sky-400 font-bold">Meta Description <span class="normal-case font-normal text-slate-500">(130–140 ตัวอักษร)</span></span>
        <span class="flex items-center gap-2"><span class="text-[10px] ${ml>=130&&ml<=140?'text-emerald-400':'text-red-400'} font-bold">${ml}/140</span><button class="copybtn" data-copy="${esc(site.meta)}">copy</button></span>
      </div>
      <div class="text-xs text-slate-300 leading-relaxed">${esc(site.meta)}</div>
    </div>
  </div>`;
}
function render(){
  document.getElementById('grid').innerHTML=SITES.map((s,i)=>card(s,i)).join('')||'<div class="col-span-full text-center text-slate-500 py-10">ไม่พบ</div>';
  document.querySelectorAll('.copybtn').forEach(b=>b.onclick=()=>{
    navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy).catch(()=>{});
    const old=b.textContent;b.textContent='copied ✓';b.classList.add('copied');
    setTimeout(()=>{b.textContent=old;b.classList.remove('copied')},1200);
  });
}
